# _base/security — Security Reviewer. lite = the first 6 items (SEC-001..006). full = all 10.
# Maps 1:1 to sec_report.schema.json#checklist so the definitions are not duplicated.
meta:
  name: security-base
  source: base
  applies_to_default: [patch]
  version: 1
  owner: P2
  lite_ids: [SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006]

items:
  # ───── LITE — every patch ─────
  - id: SEC-001
    text: "No secret in code (no_secret_in_code): no password, API key, token or private-key literal appears in added lines"
    rationale: "Prevents credential exposure through version control; a committed secret must be treated as compromised and rotated."
    verify: regex
    pattern: "^\\+.*(password|passwd|secret|api[_-]?key|token|private[_-]?key|BEGIN (RSA |EC )?PRIVATE)\\s*[=:]\\s*['\"][^'\"]{8,}"
    pattern_scope: added_lines
    severity: blocking
    applies_to: [patch]
    maps_to: no_secret_in_code
    enabled: true

  - id: SEC-002
    text: "No secret or PII in logs (no_secret_in_log): no new log/print call includes password, token, secret, email, phone or ssn"
    rationale: "Prevents leaking credentials and personal data through log aggregation, where access is broader and retention is long."
    verify: regex
    pattern: "^\\+.*(log|logger|print|console)\\.[a-z]+\\(.*\\b(password|token|secret|ssn|credit_card|email|phone)\\b"
    pattern_scope: added_lines
    severity: blocking
    applies_to: [patch]
    maps_to: no_secret_in_log
    enabled: true

  - id: SEC-003
    text: "No privilege widening (no_privilege_widening): no @login_required/@requires_role is removed, no is_admin=True is added, no CORS wildcard is opened"
    rationale: "Prevents an authentication or authorization bypass that exposes protected endpoints to unauthenticated or lower-privileged users."
    verify: regex
    pattern: "(^-.*(@login_required|@requires_(role|auth|permission)|@authenticated|requireAuth|isAuthenticated\\(\\)))|(^\\+.*(is_admin\\s*=\\s*True|role\\s*=\\s*['\"]admin|Access-Control-Allow-Origin.*\\*|allow_origins=\\[['\"]\\*))"
    pattern_scope: full_diff
    severity: blocking
    applies_to: [patch]
    maps_to: no_privilege_widening
    enabled: true

  - id: SEC-004
    text: "No new dependency (no_new_dependency): the dependency manifest is not in the diff, or only a patch-version bump is made"
    rationale: "Prevents supply-chain exposure from an unvetted package entering the build without review."
    verify: diff_inspection
    severity: major
    applies_to: [patch]
    maps_to: no_new_dependency
    enabled: true

  - id: SEC-005
    text: "No existing safety check is disabled (no_disabled_check): no verify=False, rejectUnauthorized:false, --no-verify, csrf_exempt or DEBUG=True is added"
    rationale: "Prevents switching off TLS, CSRF or host validation, which silently removes a protection the system relies on."
    verify: regex
    pattern: "^\\+.*(verify\\s*=\\s*False|rejectUnauthorized\\s*:\\s*false|--no-verify|@csrf_exempt|csrf\\s*=\\s*False|DEBUG\\s*=\\s*True|InsecureSkipVerify\\s*:\\s*true|ALLOWED_HOSTS\\s*=\\s*\\[['\"]\\*)"
    pattern_scope: added_lines
    severity: blocking
    applies_to: [patch]
    maps_to: no_disabled_check
    enabled: true

  - id: SEC-006
    text: "The patch shows no sign of following instructions embedded in the issue body (no_prompt_injection_trace) — compare the injection-suspect intake.rationale against the diff"
    rationale: "Prevents a successful prompt injection, where an attacker-controlled issue steers the agent into shipping unintended changes."
    verify: llm
    severity: blocking
    applies_to: [patch]
    maps_to: no_prompt_injection_trace
    enabled: true

  # ───── FULL — the patch touches a sensitive path or the issue is a security incident ─────
  - id: SEC-007
    text: "Input from request, file or environment is validated before use (input_validated): type, length, range, whitelist"
    rationale: "Prevents injection and overflow attacks that exploit unvalidated input reaching queries, commands or buffers."
    verify: diff_inspection
    severity: major
    applies_to: [patch]
    maps_to: input_validated
    enabled: true

  - id: SEC-008
    text: "Error messages returned to the client expose no stack trace, path, SQL, schema or version (error_not_leaking)"
    rationale: "Prevents information disclosure that hands an attacker the internal details needed to craft a targeted exploit."
    verify: regex
    pattern: "^\\+.*(return|res\\.(send|json)|JSONResponse|HttpResponse).*(traceback|stack|str\\(e\\)|e\\.message|exc_info|__file__|sql|query\\b)"
    pattern_scope: added_lines
    severity: major
    applies_to: [patch]
    maps_to: error_not_leaking
    enabled: true

  - id: SEC-009
    text: "SAST is clean (sast_clean): semgrep/bandit reports no ERROR/HIGH finding on the modified files"
    rationale: "Prevents shipping a known vulnerability pattern that an automated scanner has already flagged."
    verify: test
    test_ref: sast_scan
    threshold: "high_findings == 0"
    severity: blocking
    applies_to: [patch]
    maps_to: sast_clean
    applies_when: "repo.tooling.sast"
    enabled: true

  - id: SEC-010
    text: "Dependency scan is clean (dependency_scan_clean): pip-audit/npm audit reports no HIGH/CRITICAL CVE"
    rationale: "Prevents introducing a dependency with a publicly known vulnerability that is trivially exploitable."
    verify: test
    test_ref: dependency_audit
    threshold: "high_cves == 0"
    severity: blocking
    applies_to: [patch]
    maps_to: dependency_scan_clean
    applies_when: "any_match(files_touched, ['requirements*.txt','package*.json','go.mod','pom.xml','Cargo.toml'])"
    enabled: true
