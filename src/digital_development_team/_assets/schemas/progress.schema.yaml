# progress.yaml — Dev's running notes on a long change. Handed to the next attempt (rework, stronger model, reopen)
# and copied into blocked_report.partial, so work done is not rediscovered.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "ddt/progress"
title: Progress
type: object
additionalProperties: false
required: [items, next]

properties:
  items:
    type: array
    minItems: 1
    maxItems: 12
    description: One entry per acceptance criterion or step.
    items:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          maxLength: 40
          description: AC id (AC1) or short step name.
        status:
          type: string
          enum: [todo, doing, done, blocked]
        note:
          type: string
          maxLength: 200
          description: What changed or what is in the way.

  learned:
    type: array
    maxItems: 5
    items:
      type: string
      maxLength: 200
    description: Facts found while working that the next attempt should not rediscover (where a test lives, a quirk).

  next:
    type: string
    minLength: 5
    maxLength: 300
    description: The very next step.
