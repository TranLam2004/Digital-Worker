# agent.* — subagent delegation, depth 1 (10-harness/09). TODO(P3). P1: NOT_IMPLEMENTED.
namespace: agent
sandbox: false
artifactize: true
depth_max: 1
ops:
  - name: delegate
    risk_tier: hard_write
    allowed_roles: [dev, planner, security]
    timeout_sec: 5
    implemented: false
    description: "Delegate a self-contained sub-task, scoped to `files` that no other sub-task touches, to a depth-1 subagent (≤3 at a time; planner ≤2). Returns the subagent id immediately — fetch the result with agent.collect. Subagents cannot use blackboard.write, user.ask, agent.*, memory.* or git.commit. P1: returns NOT_IMPLEMENTED — do the work sequentially yourself."
    input_schema: { type: object, properties: { task: { type: string }, files: { type: array, items: { type: string } }, context: { type: string } }, required: [task, files], additionalProperties: false }
  - name: collect
    risk_tier: read
    allowed_roles: [dev, planner, security]
    timeout_sec: inherit
    implemented: false
    description: "Wait for a subagent started with agent.delegate (by `id`) to finish and return its result. P1: returns NOT_IMPLEMENTED."
    input_schema: { type: object, properties: { id: { type: string } }, required: [id], additionalProperties: false }
  - name: stop
    risk_tier: soft_write
    allowed_roles: [dev, planner, security]
    timeout_sec: 5
    implemented: false
    description: "Stop (cancel) a running subagent by `id`. P1: returns NOT_IMPLEMENTED."
    input_schema: { type: object, properties: { id: { type: string } }, required: [id], additionalProperties: false }
  - name: list
    risk_tier: read
    allowed_roles: [dev, planner, security]
    timeout_sec: 2
    implemented: false
    description: "List the subagents you started that are still running. P1: returns NOT_IMPLEMENTED."
    input_schema: { type: object, properties: {}, additionalProperties: false }
